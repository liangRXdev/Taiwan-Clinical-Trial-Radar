[project]
name = "taiwan-clinical-trial-radar"
version = "0.1.0"
description = "台灣藥品臨床試驗檢索站：TFDA dataset 205 的 build-time ETL 與靜態 artifact 產生器"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# fixture 自檢腳本不是 pytest 測試，由 tests/fixtures/run_all.py 單獨跑
norecursedirs = ["tests/fixtures"]
